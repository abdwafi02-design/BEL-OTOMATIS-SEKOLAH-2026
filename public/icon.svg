<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="bellGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  
  <!-- Outer sound waves -->
  <path d="M 120 180 A 180 180 0 0 0 120 330" fill="none" stroke="#67e8f9" stroke-width="20" stroke-linecap="round" opacity="0.6"/>
  <path d="M 392 180 A 180 180 0 0 1 392 330" fill="none" stroke="#67e8f9" stroke-width="20" stroke-linecap="round" opacity="0.6"/>
  <path d="M 80 140 A 240 240 0 0 0 80 370" fill="none" stroke="#38bdf8" stroke-width="16" stroke-linecap="round" opacity="0.35"/>
  <path d="M 432 140 A 240 240 0 0 1 432 370" fill="none" stroke="#38bdf8" stroke-width="16" stroke-linecap="round" opacity="0.35"/>

  <!-- Bell top mount -->
  <ellipse cx="256" cy="120" rx="36" ry="20" fill="#cbd5e1" filter="url(#shadow)"/>
  <circle cx="256" cy="115" r="16" fill="#475569" />

  <!-- Bell body -->
  <path d="M 256 125 C 200 125 180 200 170 290 C 160 360 135 375 135 385 C 135 395 145 405 170 405 L 342 405 C 367 405 377 395 377 385 C 377 375 352 360 342 290 C 332 200 312 125 256 125 Z" 
        fill="url(#bellGold)" 
        filter="url(#shadow)" />

  <!-- Bell highlight and accents -->
  <path d="M 220 150 C 190 200 185 270 180 340 C 175 380 165 390 160 395" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="10" 
        stroke-linecap="round" 
        opacity="0.5"/>

  <!-- Clapper / Pendulum -->
  <ellipse cx="256" cy="425" rx="32" ry="24" fill="#a16207" filter="url(#shadow)"/>
  <ellipse cx="256" cy="420" rx="24" ry="16" fill="#fef08a" opacity="0.8"/>
  
  <!-- Little clock badge at bottom corner -->
  <circle cx="380" cy="380" r="54" fill="#0f172a" stroke="#38bdf8" stroke-width="6"/>
  <circle cx="380" cy="380" r="44" fill="#1e293b"/>
  <line x1="380" y1="380" x2="380" y2="350" stroke="#f8fafc" stroke-width="6" stroke-linecap="round"/>
  <line x1="380" y1="380" x2="402" y2="380" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
  <circle cx="380" cy="380" r="4" fill="#38bdf8"/>
</svg>
